name: Deploy Pages per branch subpath

on:
  push:
    branches:
      - "main"
      - "core"
      - "member/NC"
      - "member/AE"
      - "member/MK"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve deployment path
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            main)
              echo "SITE_PATH=" >> "$GITHUB_ENV"
              echo "SITE_LABEL=root" >> "$GITHUB_ENV"
              echo "VITE_BASE_PATH=/aiui/" >> "$GITHUB_ENV"
              ;;
            core)
              echo "SITE_PATH=core" >> "$GITHUB_ENV"
              echo "SITE_LABEL=core" >> "$GITHUB_ENV"
              echo "VITE_BASE_PATH=/aiui/core/" >> "$GITHUB_ENV"
              ;;
            member/NC)
              echo "SITE_PATH=nc" >> "$GITHUB_ENV"
              echo "SITE_LABEL=nc" >> "$GITHUB_ENV"
              echo "VITE_BASE_PATH=/aiui/nc/" >> "$GITHUB_ENV"
              ;;
            member/AE)
              echo "SITE_PATH=ae" >> "$GITHUB_ENV"
              echo "SITE_LABEL=ae" >> "$GITHUB_ENV"
              echo "VITE_BASE_PATH=/aiui/ae/" >> "$GITHUB_ENV"
              ;;
            member/MK)
              echo "SITE_PATH=mk" >> "$GITHUB_ENV"
              echo "SITE_LABEL=mk" >> "$GITHUB_ENV"
              echo "VITE_BASE_PATH=/aiui/mk/" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          VITE_BASE_PATH: ${{ env.VITE_BASE_PATH }}
        run: npm run build

      - name: Prepare gh-pages branch content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          SITE_REPO_DIR="${RUNNER_TEMP}/gh-pages-site"

          sync_site_dir() {
            if [ -z "${SITE_PATH}" ]; then
              find . -mindepth 1 -maxdepth 1 \
                ! -name ".git" \
                ! -name ".nojekyll" \
                ! -name "core" \
                ! -name "nc" \
                ! -name "ae" \
                ! -name "mk" \
                -exec rm -rf {} +
              rsync -avc --delete "${GITHUB_WORKSPACE}/dist/" ./
            else
              rm -rf "${SITE_PATH}"
              mkdir -p "${SITE_PATH}"
              rsync -avc --delete "${GITHUB_WORKSPACE}/dist/" "${SITE_PATH}/"
            fi

            touch .nojekyll
          }

          rm -rf "${SITE_REPO_DIR}"

          if git ls-remote --exit-code --heads "${REPO_URL}" gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --depth 1 "${REPO_URL}" "${SITE_REPO_DIR}"
          else
            git init "${SITE_REPO_DIR}"
            cd "${SITE_REPO_DIR}"
            git checkout --orphan gh-pages
            git remote add origin "${REPO_URL}"
          fi

          cd "${SITE_REPO_DIR}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          sync_site_dir
          git add -A

          if git diff --cached --quiet; then
            echo "HAS_CHANGES=false" >> "$GITHUB_ENV"
            exit 0
          fi

          git commit -m "Deploy ${GITHUB_REF_NAME} to ${SITE_LABEL}"
          echo "HAS_CHANGES=true" >> "$GITHUB_ENV"

      - name: Push gh-pages updates
        if: env.HAS_CHANGES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          SITE_REPO_DIR="${RUNNER_TEMP}/gh-pages-site"
          cd "${SITE_REPO_DIR}"

          sync_site_dir() {
            if [ -z "${SITE_PATH}" ]; then
              find . -mindepth 1 -maxdepth 1 \
                ! -name ".git" \
                ! -name ".nojekyll" \
                ! -name "core" \
                ! -name "nc" \
                ! -name "ae" \
                ! -name "mk" \
                -exec rm -rf {} +
              rsync -avc --delete "${GITHUB_WORKSPACE}/dist/" ./
            else
              rm -rf "${SITE_PATH}"
              mkdir -p "${SITE_PATH}"
              rsync -avc --delete "${GITHUB_WORKSPACE}/dist/" "${SITE_PATH}/"
            fi

            touch .nojekyll
          }

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:gh-pages; then
              exit 0
            fi

            if [ "${attempt}" -eq 5 ]; then
              echo "Failed to push gh-pages after ${attempt} attempts" >&2
              exit 1
            fi

            git fetch origin gh-pages
            git reset --hard origin/gh-pages
            sync_site_dir
            git add -A

            if git diff --cached --quiet; then
              echo "No changes to redeploy after refreshing gh-pages"
              exit 0
            fi

            git commit -m "Deploy ${GITHUB_REF_NAME} to ${SITE_LABEL}"
            sleep $((attempt * 5))
          done
