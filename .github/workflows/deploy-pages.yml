name: Deploy Pages snapshot

on:
  push:
    branches:
      - main
      - core
      - member/NC
      - member/AE
      - member/MK
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch deployment branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            main \
            core \
            member/NC \
            member/AE \
            member/MK \
            gh-pages:refs/remotes/origin/gh-pages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build full Pages snapshot
        shell: bash
        run: |
          set -euo pipefail

          BUILD_ROOT="${RUNNER_TEMP}/pages-builds"
          SNAPSHOT_ROOT="${RUNNER_TEMP}/pages-snapshot"

          rm -rf "${BUILD_ROOT}" "${SNAPSHOT_ROOT}"
          mkdir -p "${BUILD_ROOT}" "${SNAPSHOT_ROOT}"
          touch "${SNAPSHOT_ROOT}/.nojekyll"

          build_site() {
            local source_branch="$1"
            local site_path="$2"
            local vite_base_path="$3"
            local worktree_key="$4"
            local worktree_dir="${BUILD_ROOT}/${worktree_key}"

            git worktree add --force --detach "${worktree_dir}" "origin/${source_branch}"

            pushd "${worktree_dir}" >/dev/null
            npm ci
            VITE_BASE_PATH="${vite_base_path}" npm run build
            popd >/dev/null

            if [ -z "${site_path}" ]; then
              rsync -av "${worktree_dir}/dist/" "${SNAPSHOT_ROOT}/"
            else
              mkdir -p "${SNAPSHOT_ROOT}/${site_path}"
              rsync -av "${worktree_dir}/dist/" "${SNAPSHOT_ROOT}/${site_path}/"
            fi

            git worktree remove --force "${worktree_dir}"
          }

          build_site "main" "" "/aiui/" "main"
          build_site "core" "core" "/aiui/core/" "core"
          build_site "member/NC" "nc" "/aiui/nc/" "member-nc"
          build_site "member/AE" "ae" "/aiui/ae/" "member-ae"
          build_site "member/MK" "mk" "/aiui/mk/" "member-mk"

      - name: Publish snapshot to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          SNAPSHOT_ROOT="${RUNNER_TEMP}/pages-snapshot"
          PUBLISH_ROOT="${RUNNER_TEMP}/gh-pages-site"
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          rm -rf "${PUBLISH_ROOT}"

          if git ls-remote --exit-code --heads "${REPO_URL}" gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --depth 1 "${REPO_URL}" "${PUBLISH_ROOT}"
          else
            git init "${PUBLISH_ROOT}"
            pushd "${PUBLISH_ROOT}" >/dev/null
            git checkout --orphan gh-pages
            git remote add origin "${REPO_URL}"
            popd >/dev/null
          fi

          pushd "${PUBLISH_ROOT}" >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          rsync -av --delete "${SNAPSHOT_ROOT}/" ./

          git add -A

          if git diff --cached --quiet; then
            echo "GitHub Pages is already up to date"
            exit 0
          fi

          git commit -m "Deploy Pages snapshot from ${GITHUB_REF_NAME}"
          git push origin HEAD:gh-pages
          popd >/dev/null
